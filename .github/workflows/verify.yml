name: Verify skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify portable packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run package verifiers
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for verifier in skills/*/evals/verify.mjs; do
            [[ -f "$verifier" ]] || continue
            found=1
            node "$verifier"
          done
          [[ "$found" -eq 1 ]] || {
            echo "No skill package verifier found." >&2
            exit 1
          }
